name: sh4prep
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["tools/sh4prep/**", "port/src/d3d8/shader_translate.*", ".github/workflows/sh4prep.yml"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: windows-latest, bin: sh4prep.exe, name: sh4prep-windows.exe }
          - { os: macos-latest, bin: sh4prep, name: sh4prep-macos }
          - { os: ubuntu-latest, bin: sh4prep, name: sh4prep-linux }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/sh4prep
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - run: cargo test --release
      - run: cargo build --release
      - run: mv target/release/${{ matrix.bin }} ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: tools/sh4prep/${{ matrix.name }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
