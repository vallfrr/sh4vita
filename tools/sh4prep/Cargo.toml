[package]
name = "sh4prep"
version = "0.3.0"
edition = "2021"
description = "Prepares the Silent Hill 4 files (PC, GOG version) for the sh4vita PS Vita port"
license = "MIT"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
sha2 = "0.11.1"

[build-dependencies]
cc = "1.9.0"

[profile.release]
opt-level = 3
strip = true
